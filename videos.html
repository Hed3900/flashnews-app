<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

content="width=device-width,

<title>Flash Videos</title>

<style>

body{

margin:0;

background:black;

font-family:Arial;

color:white;

padding-bottom:100px;

}

header{

background:red;

padding:25px;

text-align:center;

font-size:26px;

font-weight:bold;

position:sticky;

top:0;

z-index:999;

}

#videosBox{

padding:20px;

}

.videoCard{

background:#111;

border-radius:25px;

overflow:hidden;

margin-bottom:30px;

box-shadow:0 8px 25px rgba(0,0,0,0.4);

}

.videoCard h2{

padding:20px;

font-size:24px;

}

iframe{

width:100%;

height:250px;

border:none;

}

.bottomNav{

position:fixed;

bottom:0;

width:100%;

height:75px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

font-size:18px;

border-top:2px solid #222;

}

.bottomNav a{

color:white;

text-decoration:none;

}

#topBtn{

position:fixed;

bottom:100px;

right:20px;

width:65px;

height:65px;

border:none;

border-radius:50%;

background:red;

color:white;

font-size:30px;

z-index:999;

}

</style>

</head>

<body>

🎥 Flash Videos

</header>

<div id="videosBox">

</h2>

</div>

<div class="videoCard">

allowfullscreen>

</iframe>

</h2>

</div>

</div>

})">
