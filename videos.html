/* FOOTER */

}

.footer h2{

.bottomNav{

.bottomNav a{

  }

  .card{

width:90%;
max-width:350px;
margin:20px auto;
background:#111;
padding:15px;
border-radius:15px;
color:white;

  }
  .card h2{

font-size:28px;
line-height:1.4;
word-break:normal;

  }
</style>

<div id="trending-news"></div>

<style>
#trending-news{
padding:10px;
background:#000;
}

.trend-card{
background:#111;
margin-bottom:20px;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 10px rgba(255,0,0,0.3);
}

.trend-card img{
width:100%;
height:220px;
object-fit:cover;
}

.trend-content{
padding:15px;
}

.trend-content h2{
color:#fff;
font-size:22px;
line-height:1.4;
margin:0;
}

.readmore{
display:inline-block;
margin-top:12px;
padding:10px 18px;
background:red;
color:#fff;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
</style>

<script>
const feed =
'https://www.flashnews24.site/feeds/posts/default/-/jobs?alt=json';

fetch(feed)
.then(res => res.json())
.then(data => {

let html = '';

data.feed.entry.forEach(post => {

let title = post.title.$t;

let link = post.link.find(l => l.rel === 'alternate').href;

let image = post.media$thumbnail
? post.media$thumbnail.url.replace('/s72-c/','/s800/')
: 'https://via.placeholder.com/800x400';

html += `

<div class="trend-card">

<img src="${image}">

<div class="trend-content">

<h2>${title}</h2>

<a class="readmore" href="${link}">
Read More →
</a>

</div>

</div>

`;

});

document.getElementById('trending-news').innerHTML = html;

});
</script>
