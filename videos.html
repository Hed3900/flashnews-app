.videoCard{
background:#111;

border-radius:30px;

.videoCard iframe{
width:100%;
height:250px;
border:none;
}

.videoTitle{
padding:20px;
font-size:26px;
font-weight:bold;
line-height:1.5;
}

/* FOOTER */

.footer{
background:#111;
padding:40px 20px;
text-align:center;
margin-top:50px;
border-top:2px solid red;
}

.footer h2{
font-size:35px;

.footer p{

}
