<style>
.trending-container{
  padding:15px;
  background:#000;
}

.trending-title{
  color:#ff0000;
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
  text-align:center;
}

.trending-post{
  background:#111;
  border-radius:18px;
  margin-bottom:18px;
  overflow:hidden;
  box-shadow:0 0 10px rgba(255,0,0,0.3);
  transition:0.3s;
}

.trending-post:hover{
  transform:scale(1.02);
}

.trending-post img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.trending-content{
  padding:15px;
}

.trending-content h2{
  color:white;
  font-size:22px;
  margin:0;
  line-height:1.4;
}

.trending-btn{
  display:inline-block;
  margin-top:12px;
  background:red;
  color:white;
  padding:10px 18px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}
</style>

<div class="trending-container">

<div class="trending-title">
🔥 Trending News
</div>

<div id="trending-feed"></div>

</div>

<script>
fetch('/feeds/posts/default/-/jobs?alt=json')
.then(response => response.json())
.then(data => {

let posts = data.feed.entry;
let output = '';

posts.forEach(post => {

let title = post.title.$t;

let link = post.link.find(l => l.rel === 'alternate').href;

let thumbnail = post.media$thumbnail
? post.media$thumbnail.url.replace('/s72-c/','/s800/')
: 'https://via.placeholder.com/800x400';

output += `
<div class="trending-post">

<img src="${thumbnail}">

<div class="trending-content">

<h2>${title}</h2>

<a class="trending-btn" href="${link}">
Read More →
</a>

</div>
</div>
`;

});

document.getElementById('trending-feed').innerHTML = output;

});
</script>
