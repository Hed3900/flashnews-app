<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">
  
<title>Trending</title>

<style>

body{

margin:0;

background:black;

font-family:Arial;

color:white;

padding-bottom:100px;

}

header{

position:sticky;

top:0;

z-index:999;

background:black;

padding:15px;

border-bottom:4px solid red;

}

.topbar{

display:flex;

align-items:center;

gap:10px;

}

.search{

flex:1;

height:50px;

border:none;

border-radius:30px;

padding-left:20px;

font-size:18px;

background:#1a1a1a;

color:white;

}

.title{

font-size:40px;

font-weight:bold;

padding:25px;

}

#trendingBox{

padding:15px;

}

.card{

background:#1a1a1a;

border-radius:25px;

overflow:hidden;

margin-bottom:30px;

color:white;

}

.newsImg{

width:100%;

height:240px;

object-fit:cover;

}

.card h2{

padding:20px;

font-size:22px;

line-height:1.4;

}

.actions{

display:flex;

gap:10px;

padding:20px;

}

.likeBtn,
.saveBtn,
.shareBtn{

flex:1;

height:60px;

border:none;

border-radius:18px;

font-size:18px;

font-weight:bold;

color:white;

}

.likeBtn{

background:#111;

}

.saveBtn{

background:#111;

}

.shareBtn{

background:red;

}

.bottomNav{

position:fixed;

bottom:0;

width:100%;

height:75px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

font-size:18px;

border-top:2px solid #222;

}

.bottomNav a{

color:white;

text-decoration:none;

}

#topBtn{

position:fixed;

bottom:100px;

right:20px;

width:65px;

height:65px;

border:none;

border-radius:50%;

background:red;

color:white;

font-size:30px;

display:block;

z-index:999;

}
.bottomNav{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #ff000055;

backdrop-filter:blur(10px);

z-index:9999;

}

.bottomNav a{

color:white;

font-size:28px;

text-decoration:none;

transition:0.3s;

}

.bottomNav a:hover{

color:red;

transform:scale(1.2);

}
  body{

padding-bottom:90px;

  }
  .bottomNav a.active{

color:red;

transform:scale(1.2);

text-shadow:0 0 15px red;

  }
  
</style>

</head>

<body>

<header>

<div class="topbar">

<input type="text"

class="search"

placeholder="Trending">

</div>

</header>

<h1 class="title">

🔥 Trending Page

</h1>

<div id="trendingBox">
<div id="newsBox"></div>

<script>

fetch(
"https://api.rss2json.com/v1/api.json?rss_url=https://www.flashnews24.site/feeds/posts/default/-/USA"
)

.then(res => res.json())

.then(data => {

let output = "";

data.items.forEach(post => {

output += `

<div class="card">

<img src="${post.thumbnail}" width="100%">

<h2>${post.title}</h2>

<p>

${post.description.slice(0,120)}

...

</p>

<a href="${post.link}" target="_blank">

Read More

</a>

</div>

`;

});

document.getElementById(
"newsBox"
).innerHTML = output;

});

</script>
</div>

<button id="topBtn"

onclick="window.scrollTo({

top:0,

behavior:'smooth'

})">

⬆

</button>
<div class="bottomNav">

<a href="index.html">

🏠 Home

</a>

<a href="videos.html">

🎥 Videos

</a>

<a href="trending.html">

🔥 Trending

</a>

<a href="profile.html">

👤 Profile

</a>

</div>

<script>

fetch(

"https://api.rss2json.com/v1/api.json?rss_url=https://www.flashnews24.site/feeds/posts/default/-/BreakingNews"

)

.then(res=>res.json())

.then(data=>{

let output="";

for(let i=0;i<data.items.length;i++){

output += `

<a href="${data.items[i].link}"

target="_blank"

style="text-decoration:none;
color:white;">

<div class="card">

<img src="${data.items[i]
.thumbnail
.replace('s72-c','s1800')}"

class="newsImg">

<h2>

🔥 ${data.items[i].title}

</h2>

<div class="actions">

<button class="likeBtn">

🤍 Like

</button>

<button class="saveBtn">

⭐ Save

</button>

<button class="shareBtn"

onclick="shareNews(
'${data.items[i].title}',
'${data.items[i].link}'
);

return false;">

📤 Share

</button>

</div>

</div>

</a>

`;

}

document.getElementById(

"trendingBox"

).innerHTML = output;

});

function shareNews(title,link){

navigator.share({

title:title,

text:title,

url:link

});

}
function saveNews(button){

let title =
button.parentElement.querySelector("h2").innerText;

localStorage.setItem(
"savedNews",
title
);

alert("News Saved ⭐");

}

let saved =
localStorage.getItem("savedNews");

document.getElementById(
"savedBox"
).innerHTML = saved;

</script>
<div class="bottomNav">

<a href="index.html">🏠</a>

<a href="videos.html">🎥</a>

<a href="trending.html"class="active">🔥</a>

<a href="saved.html">⭐</a>

<a href="profile.html">👤</a>

</div>
</body>

</html>
