<!DOCTYPE html>

<html>

<head>

<title>Saved News</title>

<style>

body{

background:black;

color:white;

font-family:Arial;

margin:0;

padding:20px;

}

.card{

background:#111;

border-radius:25px;

overflow:hidden;

margin-bottom:25px;

box-shadow:0 8px 20px rgba(0,0,0,0.4);

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.card h2{

padding:20px;

font-size:24px;

line-height:1.4;

}

.openBtn{

display:block;

margin:20px;

padding:15px;

background:red;

color:white;

text-align:center;

border-radius:15px;

text-decoration:none;

font-size:20px;

}

</style>

</head>

<body>

<h1>

⭐ Saved News

</h1>

<div id="savedBox">

</div>

<script>

let saved = JSON.parse(

localStorage.getItem("savedNews")

) || [];

let output = "";

saved.forEach(news => {

output += `

<div class="card">

<img src="${news.image}">

<h2>

🔥 ${news.title}

</h2>

<a href="${news.link}"

class="openBtn">

Read News

</a>

</div>

`;

});

document.getElementById(

"savedBox"

).innerHTML = output;

</script>

</body>

</html>
