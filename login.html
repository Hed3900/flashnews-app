<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{

background:#111;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}

.box{

background:#222;

padding:30px;

border-radius:20px;

width:80%;

text-align:center;

}

h1{

color:white;

}

input{

width:90%;

padding:15px;

margin-top:15px;

border:none;

border-radius:10px;

font-size:16px;

}

button{

margin-top:20px;

padding:15px 25px;

background:red;

color:white;

border:none;

border-radius:12px;

font-size:18px;

width:100%;

}

</style>

</head>

<body>

<div class="box">

<h1>🔐 Login</h1>

<input type="text"
id="username"
placeholder="Enter Username">

<button onclick="login()">

Login

</button>

</div>

<script>

function login(){

let user =
document.getElementById("username")
.value;

localStorage.setItem("user", user);

window.location.href =
"index.html";

}

</script>

</body>

</html>
